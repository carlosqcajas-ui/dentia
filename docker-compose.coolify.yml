services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SERVICE_FQDN_BACKEND_8000: ${BACKEND_FQDN}
      # Production Postgres — a Supabase project's connection string, set
      # as a secret in Coolify's env var UI. No bundled db container.
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in Coolify env vars (production Supabase connection string)}
      SECRET_KEY: ${SECRET_KEY}
      ENVIRONMENT: production
      ALLOWED_ORIGINS: ${FRONTEND_URL}
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /app/storage
      # Demo deployments set SEED_ON_STARTUP=1 in Coolify env so a wiped
      # DB self-heals on next restart: alembic recreates the schema and
      # seed_demo.py repopulates it (idempotent — no-op when the demo
      # clinic already exists). Real production deployments leave it
      # unset so seed never runs.
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-0}
      SEED_LANG: ${SEED_LANG:-es}
    volumes:
      - storage_data:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=2).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.prod
      args:
        API_BASE_URL: ${BACKEND_URL}
    environment:
      SERVICE_FQDN_FRONTEND_3000: ${FRONTEND_FQDN}
      NUXT_PUBLIC_API_BASE_URL: ${BACKEND_URL}
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  storage_data:
